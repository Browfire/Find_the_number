name: Java Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Find_the_Number/pom.xml
      - name: Verify
        working-directory: Find_the_Number
        run: mvn --batch-mode --no-transfer-progress "-Djava.awt.headless=true" clean verify